name: Refresh Surge resources

on:
  schedule:
    - cron: '17 4 * * 1'  # 每周一 04:17 UTC（北京时间 12:17）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh scripts from upstream
        run: python refresh_resources.py
