name: Refresh Surge resources

on:
  push:
    branches: [main]
    paths:
      - sources.json
      - refresh_resources.py
      - .github/workflows/refresh-resources.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: surge-resources-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Refresh and validate public scripts and rule sets
        run: |
          python3 refresh_resources.py
          python3 refresh_resources.py --check-only
      - name: Commit verified resource changes
        run: |
          git add resources
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=actions@github.com commit -m "Refresh verified Surge resources"
          git push origin HEAD:main
